      setStatus('Could not save — check the values above (see console for details).', 'error');
    }
  };

  importBtn.onclick = () => {
    const text = importArea.value.trim();
    if (!text) {
      setStatus('Paste a unit\'s exported JSON first.', 'error');
      return;
    }
    const imported = importUnit(text);
    if (imported) {
      setStatus(`Imported "${imported.name}".`, 'ok');
      importArea.value = '';
      renderList();
    } else {
      setStatus('Import failed — that doesn\'t look like a valid exported unit (see console).', 'error');
    }
  };

  const continueBtn = document.createElement('button');
  continueBtn.textContent = 'Continue to Buy Phase';
  continueBtn.className = 'unit-creation-continue';
  continueBtn.onclick = () => {
    container.classList.remove('unit-creation-active');
    container.innerHTML = '';
    onDone();
  };
  container.appendChild(continueBtn);
}

// Stance/target-priority panel (C07, finishes build order step 5; stance enabled for real C13).
//
// Stance is duplicated here rather than imported from [30] — [80]'s contract only permits
// read-only WorldState from [30], not its internals, so it can't import VALID_STANCES any
// more than [50] could. Same graceful-degradation reasoning as [50]'s ORDER_TARGET_PRIORITIES
// below: [30]'s own validation is the real source of truth and silently falls back to a safe
// default if this list ever drifts stale.
//
// C13: the stance control is now a real selectable input, mirroring target priority exactly.
// [30] has consumed stance behaviorally since C09 (filterByStance) — this session only removes
// the [80]-side block that kept it unreachable through normal play. ORDERS_STANCE_FIXED is
// gone; the default selection is just the first list entry ('AllUnits'), same pattern as
// targetPriorities' default below, not a designed "default stance" — DESIGN.md doesn't specify
// one, so this picks whichever sorts first rather than asserting a preference.
const ORDERS_STANCES = ['AllUnits', 'MixedPush', 'RushBase'];

// Reads ORDER_TARGET_PRIORITIES from [50] as its catalog of legal choices — still a
// placeholder standing in for a not-yet-formalized source of truth (unlike the buy-phase
// catalog above, which is now real as of C12), marked as such at its definition site in [50].
//
// initOrdersUI never touches WorldState directly — it only ever builds a plain
// {stance, targetPriority} plan and hands it to the commander via submitOrders(), mirroring
// initBuyPhaseUI/submitLoadout exactly.
function initOrdersUI(container, commander, targetPriorities) {
  container.innerHTML = '';
  container.classList.add('orders-phase-active');

  let selectedStance = ORDERS_STANCES[0];
  let selectedPriority = targetPriorities[0];

  const heading = document.createElement('h2');
  heading.textContent = 'Stance & Target Priority';
  container.appendChild(heading);

  const stanceRow = document.createElement('div');
  stanceRow.className = 'orders-row';
  const stanceLabel = document.createElement('span');
  stanceLabel.className = 'orders-label';
  stanceLabel.textContent = 'Stance';
  const stanceSelect = document.createElement('select');
  ORDERS_STANCES.forEach((s) => {
    const opt = document.createElement('option');
    opt.value = s;
    opt.textContent = s;
    if (s === selectedStance) opt.selected = true;
    stanceSelect.appendChild(opt);
  });
  stanceSelect.onchange = () => { selectedStance = stanceSelect.value; };
  stanceRow.append(stanceLabel, stanceSelect);
  container.appendChild(stanceRow);

  const priorityRow = document.createElement('div');
  priorityRow.className = 'orders-row';
  const priorityLabel = document.createElement('span');
  priorityLabel.className = 'orders-label';
  priorityLabel.textContent = 'Target priority';
  const prioritySelect = document.createElement('select');
  targetPriorities.forEach((p) => {
    const opt = document.createElement('option');
    opt.value = p;
    opt.textContent = p;
    prioritySelect.appendChild(opt);
  });
  prioritySelect.onchange = () => { selectedPriority = prioritySelect.value; };
  priorityRow.append(priorityLabel, prioritySelect);
  container.appendChild(priorityRow);

  const submitBtn = document.createElement('button');
  submitBtn.textContent = 'Confirm Orders';
  submitBtn.className = 'orders-submit';
  submitBtn.onclick = () => {
    container.classList.remove('orders-phase-active');
    container.innerHTML = '';
    commander.submitOrders({ stance: selectedStance, targetPriority: selectedPriority });
  };
  container.appendChild(submitBtn);
}


// ══════════════════════════════════════════════════════════
// [90] BOOTSTRAP — wire it up, start the loop
// EXPORTS: (none — entry point)
// MAY USE:  [10]-[80]
// MUST NOT: contain game logic; wiring only
// Note: this is a module script, so top-level `await` (used below to await
// both commanders' loadouts before either is touched) is valid here.
// ══════════════════════════════════════════════════════════

const log = (line) => {
  console.log(line);
  document.getElementById('log').textContent += line + '\n';
};

const SEED = 12345;

// ---- Commander-produced loadouts (new in C03) ----
// [60] MATCH FLOW doesn't exist yet, so bootstrap is standing in for it here
// — but even this stand-in requests both loadouts and awaits both before
// touching either result, which is the ordering [60] will own for real.
// HumanCommander and AICommander are used side by side on purpose: bootstrap
// (and later, match flow) cannot and does not tell them apart.

const BUDGET = 100; // placeholder — economy isn't designed yet (DESIGN.md §5)

// C12 wiring: [25]'s loadFromStorage() must run before any commander or UI
// touches unit data (ARCHITECTURE.md's [90] contract), so a custom unit
// saved in an earlier session is buyable from the very first buy phase.
loadFromStorage();

const commanderA = new HumanCommander(SEED + 1);
const commanderB = new AICommander(SEED + 2);

// commanderA.chooseLoadout() no longer resolves instantly (C04) — it resolves when the
// buy-phase UI below calls commanderA.submitLoadout(). The Promise executor runs
// synchronously, so calling chooseLoadout() here already arms that hook regardless of
// when initBuyPhaseUI actually mounts.
const loadoutPromiseA = commanderA.chooseLoadout(BUDGET, 'A', {});
const loadoutPromiseB = commanderB.chooseLoadout(BUDGET, 'B', {});

// C15 wiring: the new unit-creation panel is an optional step ahead of the buy phase — the
// same "mount next phase from a completion callback" pattern already used below to hand off
// from buy phase to orders phase. buyableCatalog() is called inside the callback (not before
// it), so anything the player just created is already present in the very first buy-phase
// render — no separate refresh path needed, since [50]'s buyableCatalog() re-reads
// listCustomUnits() fresh on every call (C12).
function startBuyPhase() {
  initBuyPhaseUI(document.getElementById('buy-phase'), commanderA, BUDGET, buyableCatalog('A'));
  log('Waiting for Commander A (Human) to submit a loadout...');
}
initUnitCreationUI(document.getElementById('unit-creation'), startBuyPhase);

const [loadoutPlanA, loadoutPlanB] = await Promise.all([loadoutPromiseA, loadoutPromiseB]);

const loadoutA = loadoutPlanA.units;
const loadoutB = loadoutPlanB.units;

log(`Commander A (Human, stand-in) fielded ${loadoutA.length} units`);
log(`Commander B (AI, Easy) fielded ${loadoutB.length} units`);

// Exercises chooseOrders too, so both interface methods are proven live.
// [30] now consumes targetPriority (stance is stored but not yet branched
// on — see [30]'s note). As of C07, commanderA.chooseOrders() no longer
// resolves via a stub — it resolves when the orders panel below calls
// commanderA.submitOrders(). Same synchronous-executor timing as the buy
// phase: calling chooseOrders() arms the hook before initOrdersUI is wired.
const ordersPromiseA = commanderA.chooseOrders([], []);
const ordersPromiseB = commanderB.chooseOrders([], []);

initOrdersUI(document.getElementById('orders-phase'), commanderA, ORDER_TARGET_PRIORITIES);
log('Waiting for Commander A (Human) to submit orders...');

const [ordersA, ordersB] = await Promise.all([ordersPromiseA, ordersPromiseB]);
log(`Commander A orders: stance=${ordersA.stance} targetPriority=${ordersA.targetPriority}`);
log(`Commander B orders: stance=${ordersB.stance} targetPriority=${ordersB.targetPriority}`);

// ---- Instant headless run + determinism check ----
// C08: stop condition is now [40]'s baseDestruction, not wipeout. Wipeout on
// its own no longer ends anything — a side with zero units left but a
// standing base just has nothing to fight until the enemy reaches that base,
// which is the intended DESIGN.md behavior (annihilation isn't a v1 win
// condition; base destruction is the only one).

const MAX_TICKS = 20 * 90; // bumped from 60s (C01) — bases sit further out
                            // (BASE_X=130) than the old wipeout-only checks
                            // ever needed to account for; still a placeholder
                            // safety cap, not a designed round-timer (DESIGN.md §5).

function runToCompletion(seed) {
  const world = createWorld(seed, loadoutA, loadoutB, ordersA, ordersB);
  while (world.tick < MAX_TICKS) {
    stepWorld(world);
    if (baseDestruction(world)) break;
  }
  return world;
}

const headlessWorld = runToCompletion(SEED);
const headlessWinner = baseDestruction(headlessWorld);

log(`Match ended at tick ${headlessWorld.tick} (t=${headlessWorld.time.toFixed(2)}s) ` +
    `— winner: ${headlessWinner ?? 'none (hit MAX_TICKS safety cap)'}`);
for (const u of headlessWorld.units) {
  log(`  ${u.id} [${u.faction}] hp=${Math.max(0, u.hp).toFixed(1)} alive=${u.alive}`);
}

const worldCheck = runToCompletion(SEED);
const identical =
  headlessWorld.tick === worldCheck.tick &&
  JSON.stringify(headlessWorld.units) === JSON.stringify(worldCheck.units);

log(`\nDeterminism check (same seed, rerun): ${identical ? 'PASS' : 'FAIL'}`);

// ---- Live, rendered match (new in C02) ----
// A fresh world, stepped in real time at a fixed 20Hz tick, decoupled from
// the render rate via an accumulator. The renderer only ever reads it.

function snapshotPositions(world) {
  const unitsById = new Map();
  for (const u of world.units) {
    unitsById.set(u.id, { pos: { ...u.pos }, alive: u.alive });
  }
  // 2026-09-23: projectiles too, so [70] interpolates them like units.
  const projectilesById = new Map();
  for (const p of world.projectiles) {
    projectilesById.set(p.id, { pos: { ...p.pos } });
  }
  return { unitsById, projectilesById };
}

const liveWorld = createWorld(SEED, loadoutA, loadoutB, ordersA, ordersB);
const TICK_DT = liveWorld.dt; // 1/20, sourced from [30] rather than restated here

const viewport = document.getElementById('viewport');
initRenderer(viewport, liveWorld);
document.getElementById('camera-reset').addEventListener('click', resetCommanderView);

let prevSnapshot = snapshotPositions(liveWorld);
let accumulator = 0;
let lastTime = performance.now();

// C08: the live match now stops on [40]'s baseDestruction result instead of
// ticking forever past wipeout. This is still a [90]-level stand-in for
// real [60] MATCH FLOW (which will own round loop / budget / persistence
// later) — same "stand in until the real section exists" pattern as C04–C07
// used for loadouts and orders before [50]/[80] existed.
let liveWinner = null;

function frame(now) {
  requestAnimationFrame(frame);

  let delta = (now - lastTime) / 1000;
  lastTime = now;
  delta = Math.min(delta, 0.25); // clamp big pauses (tab backgrounded, breakpoint, etc.)

  accumulator += delta;
  while (!liveWinner && accumulator >= TICK_DT) {
    prevSnapshot = snapshotPositions(liveWorld);
    stepWorld(liveWorld);
    accumulator -= TICK_DT;

    const winner = baseDestruction(liveWorld);
    if (winner) {
      liveWinner = winner;
      log(`Live match ended at tick ${liveWorld.tick} (t=${liveWorld.time.toFixed(2)}s) ` +
          `— Commander ${winner} wins!`);
      break;
    }
  }

  // Once decided, freeze on the final tick's real positions (alpha=1)
  // rather than continuing to interpolate against a stale accumulator.
  const alpha = liveWinner ? 1 : accumulator / TICK_DT;
  renderFrame(prevSnapshot, liveWorld, alpha);
}

requestAnimationFrame(frame);

</script>
</body>
